<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <section id="header">
        <div id="hello">
            <p>Olá, Ana</p>
        </div>
        <div id="circle">
            <p>A</p>
        </div>
    </section>
    <div id="titles">
        <h1>O que você vai aprender hoje?</h1>
    </div>

    <section id="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Buscar cursos">
    </section>

    <section id="pills">
        <div id="todes">
            <h1>Todos</h1>
        </div>
        <div>
            <h1>Front-End</h1>
        </div>
        <div>
            <h1>Back-End</h1>
        </div>
        <div>
            <h1>Dados</h1>
        </div>
    </section>

    <section id="courses">
        <div id="recomendados">
            <h1>Recomendados</h1>
        </div>
        <div class="card">
            <div class="information">
                <div class="information-icon blue">
                    <i class="fa-solid fa-code"></i>
                </div>
                <div class="information-description">
                    <h3>HTML e CSS do zero</h3>
                    <p>Iniciante · 4h · 12 aulas</p>
                </div>
            </div>
            <div class="information-arrow">
                <i class="fa-solid fa-angle-right"></i>
            </div>
        </div>
        <div class="card">
            <div class="information">
                <div class="information-icon orange">
                    <i class="fa-solid fa-database"></i>
                </div>
                <div class="information-description">
                    <h3>Node e Postgresql</h3>
                    <p>Intermediário · 6h · 18 aulas</p>
                </div>
            </div>
            <div class="information-arrow">
                <i class="fa-solid fa-angle-right"></i>
            </div>
        </div>
        <div class="card">
            <div class="information">
                <div class="information-icon green">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="information-description">
                    <h3>Arquitetura de Front-End</h3>
                    <p>Avançado · 5h · 15 aulas</p>
                </div>
            </div>
            <div class="information-arrow">
                <i class="fa-solid fa-angle-right"></i>
            </div>
        </div>
        <div class="card">
            <div class="information">
                <div class="information-icon yellow">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <div class="information-description">
                    <h3>Python para automação</h3>
                    <p>Iniciante · 3h · 10 aulas</p>
                </div>
            </div>
            <div class="information-arrow">
                <i class="fa-solid fa-angle-right"></i>
            </div>
        </div>
    </section>

</body>

</html>
